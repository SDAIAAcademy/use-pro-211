<h1>صور الفحص الثلاثون</h1>

<p>ثلاثون صورة من جولة فحص في المحطة، لكل منها سؤال واحد وقيمة معروفة قرأها شخصان من المعدة نفسها. الصور رسوم تؤدي دور الصور الفوتوغرافية.</p>
