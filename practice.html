<section>
<h2>اليوم 1: الحدود والإجراءات</h2>
<ol>
<li><p>إنذار الاهتزاز في مضخة يتكرر، والمشغّل يريد إبقاءها تعمل إلى آخر الوردية. سأل المساعد المعتمد عن تجاوز الإنذار مؤقتًا، فأعطاه خطوات مرتبة وذكر أنها من الدليل التشغيلي. ما التصرف الصحيح؟</p><ul><li><b>أ.</b> يطابق الخطوات على الدليل بندًا بندًا، ثم ينفذها</li><li><b>ب.</b> يعيد السؤال على نموذج محلي داخل شبكة المحطة، وينفذ جوابه</li><li><b>ج.</b> يترك الخطوات، ويقرر المخوَّل وفق إجراء تجاوز الإنذارات المعتمد</li><li><b>د.</b> ينفذ الخطوات كما هي، ويترك مراجعتها لمشرف التشغيل بعد الوردية</li></ul></li>
<li><p>في مسودة إجراء كتبها المساعد: «اضبط صمام الأمان على 6.0 bar. المصدر: الدليل، المراجعة B، القسم 3.2». فتحتَ القسم 3.2 في المراجعة B فوجدت 6.0 bar فعلًا. والمراجعة السارية عندك C. ما الحكم على الخطوة؟</p><ul><li><b>أ.</b> لا حكم بعد: تفتح القسم نفسه في المراجعة السارية وتطابق عليه</li><li><b>ب.</b> مطابق: القيمة موجودة في القسم الذي ذكره المساعد</li><li><b>ج.</b> خطأ في القيمة: المراجعة قديمة، فالرقم قديم حتمًا</li><li><b>د.</b> تسأل المساعد عن قيمة المراجعة السارية وتكتب جوابه</li></ul></li>
<li><p>مشرف وردية يطلب من المساعد المعتمد مسودة إعلان عن دورة تدريبية في السلامة، ليرسلها إلى فريقه بعد أن يراجعها بنفسه. أي مستوى لهذا الاستخدام، وأي تحقق يناسبه؟</p><ul><li><b>أ.</b> المستوى أ، والتحقق V1: يقرأ المشرف الإعلان قبل أن يرسله</li><li><b>ب.</b> المستوى ب، والتحقق V2: يطابق كل جملة على المراجعة السارية من الدليل</li><li><b>ج.</b> المستوى ج، والتحقق V5: لا يُستعمل الإعلان أصلًا</li><li><b>د.</b> المستوى أ، ولا تحقق: الإعلان لا يدخل وثيقة ولا معدة</li></ul></li>
<li><p>مهندسة صيانة تسأل المساعد المعتمد عن رقم حشية غطاء النافخ ومقاسها من دليله، لتكتبهما في طلب شراء قطعة الغيار. ما التحقق الذي يحتاج إليه الجواب قبل أن يدخل الطلب؟</p><ul><li><b>أ.</b> قراءة المهندسة للجواب قبل نسخه، كما تُقرأ أي مسودة</li><li><b>ب.</b> مطابقة الرقم والمقاس ووحدته على المراجعة السارية من الدليل</li><li><b>ج.</b> لا تحقق، لأن المساعد ذكر القسم الذي أخذ منه الرقم</li><li><b>د.</b> عينة من خمسين جوابًا مشابهًا يراجعها إنسان قبل اعتمادها</li></ul></li>
<li><p>مشرف يطلب من المساعد المعتمد أن يملأ تصريح عمل لتنظيف مصفاة السحب من وصف العمل، ليوقّعه ويصدره. أعطاه المساعد تصريحًا مكتمل الخانات. ما التصرف الصحيح؟</p><ul><li><b>أ.</b> يطابق خانات التصريح على وصف العمل، ثم يصدره</li><li><b>ب.</b> يعيد الطلب على نموذج محلي، فإن اتفق الجوابان أصدره</li><li><b>ج.</b> يملأ المُصدِر التصريح بنفسه بعد أن يرى الموقع</li><li><b>د.</b> يصدره، ويطلب من المنفّذ مراجعة الخانات قبل البدء</li></ul></li>
<li><p>فني يريد أن يسأل مساعدًا عامًّا على الإنترنت عن معنى رمز إنذار على شاشة لوحة التحكم، وفي نيته أن يرفع لقطة الشاشة كاملة، وفيها قائمة نقاط الضبط المصنفة سرية. ما التصرف الصحيح؟</p><ul><li><b>أ.</b> يرفع اللقطة، لأن السؤال تعلّم من المستوى أ</li><li><b>ب.</b> يرفع اللقطة إلى المساعد المعتمد بدل العام، لأنه معتمد</li><li><b>ج.</b> يحذف اسم المحطة من اللقطة ثم يرفعها إلى المساعد العام</li><li><b>د.</b> يكتب رمز الإنذار بالكلمات دون اللقطة، أو يسأل نموذجًا محليًّا</li></ul></li>
<li><p>صوّر فني مجس اهتزاز على مضخة ليسأل المساعد المعتمد عن قراءته. في خلفية الصورة شاشة مغيّر السرعة وعليها نقاط ضبط مصنفة سرية. صور الفحص في جهته مقيدة. ما مستوى هذه الصورة، وما العمل؟</p><ul><li><b>أ.</b> سرية: يقص الصورة على المجس، أو يسأل نموذجًا محليًّا</li><li><b>ب.</b> مقيدة كسائر صور الفحص، فيرفعها كما هي إلى المساعد المعتمد</li><li><b>ج.</b> عامة، لأن المقصود قراءة مجس واحد</li><li><b>د.</b> مقيدة، ويطلب في السؤال أن يتجاهل المساعد الشاشة</li></ul></li>
<li><p>في مسودة إجراء كتبها المساعد: «شدّ مسامير غطاء المحمل بعزم 45 lbf·ft (الدليل، المراجعة F، القسم 6.2)». المراجعة F سارية، وفي جدول القسم 6.2: 45 N·m. ما الحكم على الخطوة؟</p><ul><li><b>أ.</b> مطابق: الرقم والقسم والمراجعة كما في الدليل</li><li><b>ب.</b> قيمة خطأ: العزم في الدليل رقم آخر</li><li><b>ج.</b> وحدة خطأ: يُكتب 45 N·m كما في الدليل</li><li><b>د.</b> لا مصدر: القسم 6.2 لا يذكر هذه الخطوة</li></ul></li>
<li><p>خطوة في مسودة المساعد: «حد المستوى الأدنى للسحب 0.9 m (المراجعة E، القسم 3.4)». المراجعة السارية F. فتحت القسم 3.4 في المراجعة F فوجدت 0.9 m. ما الذي تكتبه في جدول التعديلات؟</p><ul><li><b>أ.</b> قيمة من مراجعة ملغاة: يُشطب الرقم ويُطلب رقم جديد</li><li><b>ب.</b> مطابقة، ويُصحَّح المصدر إلى المراجعة F</li><li><b>ج.</b> لا حكم قبل أن يُسأل المساعد عن قيمة المراجعة F</li><li><b>د.</b> تُحذف الخطوة، لأن مصدرها مراجعة ملغاة</li></ul></li>
<li><p>رتّب خطوات تجهيز ضاغط هواء لفتح غطاء خزانه، كما في المراجعة السارية من دليله.</p><ul><li>تحقق من أن مقياس الخزان يقرأ صفرًا قبل فتح الغطاء</li><li>اعزل مصدره الكهربائي، واقفله وعلّق البطاقة</li><li>أوقف الضاغط من لوحته</li><li>نفّس ضغط الخزان من صمام التنفيس اليدوي</li></ul></li>
<li><p>طابقت خطوات مسودة إجراء الخمس عشرة على المراجعة السارية: المصدر والقيمة والوحدة والرمز والترتيب، وكلها سليمة. ما الذي بقي قبل أن تكتب أن المسودة متحقق منها؟</p><ul><li><b>أ.</b> أن تطلب من المساعد أن يؤكد أن كل خطوات الدليل في المسودة</li><li><b>ب.</b> أن يوقّع مشرف الوردية على جدول المطابقة</li><li><b>ج.</b> أن تعيد مطابقة المصطلحات العربية على الإنجليزية</li><li><b>د.</b> أن تمشي على الدليل قسمًا قسمًا: أين خطوة كل جملة؟</li></ul></li>
<li><p>في الدليل: «ضغط زيت التزييت في التشغيل بين 1.5 و2.5 bar، ويُوقف المحرك إن خرج عنه». وفي مسودة المساعد: «تأكد أن ضغط زيت التزييت 2.0 bar». ما الحكم على الخطوة؟</p><ul><li><b>أ.</b> ناقص: يُكتب النطاق بحديه وشرط الإيقاف كما في الدليل</li><li><b>ب.</b> مطابق: 2.0 bar داخل النطاق المسموح في الدليل</li><li><b>ج.</b> قيمة خطأ: الصحيح 2.5 bar، وهو الحد الأعلى</li><li><b>د.</b> وحدة خطأ: الدليل يذكر الضغط بوحدة أخرى</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: السجلات والصور</h2>
<ol>
<li><p>سأل مهندس في محطة أخرى المساعد في المحادثة عن أعطال صمام عدم رجوع في سجل عام، فأجاب: «سبعة، عددتُها بعناية». سيُبنى على الرقم قرار استبدال الصمام. ما الذي يجعله صالحًا لهذا القرار؟</p><ul><li><b>أ.</b> أن يُسأل المساعد ثانية، فإن أعطى الرقم نفسه اعتُمد</li><li><b>ب.</b> رمز يُتحقق منه على عينة، وعدد يحسبه الكود من صفوف تُعرض</li><li><b>ج.</b> أن يُعاد السؤال على نموذج محلي داخل شبكة المحطة</li><li><b>د.</b> أن يُطلب منه في الأمر أن يتحقق من العدد قبل أن يجيب</li></ul></li>
<li><p>في محطة أخرى قيست قراءة المساعد على 20 صورة بقيم معروفة: 3 قراءات خاطئة في 12 صورة لمقاييس حرارة بمؤشر، ولا خطأ في 8 صور لشاشات رقمية، منها شاشة كاشف الغاز عند مدخل البئر. أي قاعدة يسندها هذا القياس؟</p><ul><li><b>أ.</b> يقرأ المساعد كل الصور، لأن 17 قراءة من 20 صحيحة في المجموع</li><li><b>ب.</b> يقرأ إنسان المقاييس، وتُعتمد قراءة المساعد للشاشات كلها دون فحص</li><li><b>ج.</b> تُعتمد كل قراءة يذكر المساعد أنه واثق منها، ويقرأ إنسان الباقي</li><li><b>د.</b> يقرأ إنسان المقاييس والكاشف، وبقية الشاشات مسودة تُطابَق عينة منها</li></ul></li>
<li><p>رمّز المساعد أمر العمل «فحص شهري: لا يوجد صوت غير طبيعي في المحمل» بالرمز BRG. ما الرمز الصحيح بدليل الترميز؟</p><ul><li><b>أ.</b> BRG: النص يذكر المحمل</li><li><b>ب.</b> OTH: لا رمز يناسب فحصًا لم يجد شيئًا</li><li><b>ج.</b> PM: فحص دوري بلا عطل</li><li><b>د.</b> INST: الفحص بجهاز يقيس الصوت</li></ul></li>
<li><p>رمّزت عينة ثابتة من 50 أمر عمل بيدك: اتفقت مع المساعد في 46. الخلافات الأربعة كلها أعطال صمامات بلغة الورشة («البلف علّق») رمّزها المساعد OTH. ما الخطوة التالية؟</p><ul><li><b>أ.</b> تعتمد الترميز كما هو، لأن الاتفاق في العينة 92%</li><li><b>ب.</b> تسحب عينة ثانية ببذرة أخرى حتى يرتفع الاتفاق</li><li><b>ج.</b> تزيد عدد أعطال الصمامات 8% في كل معدة لتعويض الخطأ</li><li><b>د.</b> تبحث في صفوف OTH عن كلمات الورشة، ثم تعيد العدّ</li></ul></li>
<li><p>سألت المساعد في المحادثة مرتين عن أعطال صمام عدم رجوع في سجل عامين، فأجاب 6 ثم 9. ما العدد الذي يدخل جدول الأعطال؟</p><ul><li><b>أ.</b> 7.5، متوسط الجوابين</li><li><b>ب.</b> ما تحسبه صيغة أو سكربت من الصفوف</li><li><b>ج.</b> جواب ثالث يُطلب، ويُعتمد ما اتفق عليه اثنان</li><li><b>د.</b> 9، الأكبر، احتياطًا للسلامة</li></ul></li>
<li><p>دليل الترميز يعرّف العطل المتكرر: الرمز نفسه في المعدة نفسها ثلاث مرات أو أكثر خلال أي 90 يومًا. لصمام عزل خمسة أعطال VLV في عام، وبين كل عطلين متتاليين 77 يومًا على الأقل. هل العطل متكرر؟</p><ul><li><b>أ.</b> نعم: خمسة أعطال في عام واحد</li><li><b>ب.</b> نعم: كل عطلين متتاليين في أقل من 90 يومًا</li><li><b>ج.</b> لا: لا تجتمع ثلاثة منها في 90 يومًا</li><li><b>د.</b> لا يُعرف قبل أن يُسأل المساعد عن التكرار</li></ul></li>
<li><p>جدول الأعطال المتكررة جاهز، وستقرؤه الإدارة لتقرر استبدال معدات. أي جملة في ملاحظة الثقة تحته تمنع أن يُستعمل الجدول في أكثر مما يحتمل؟</p><ul><li><b>أ.</b> «الأعداد دقيقة لأن السكربت حسبها من الصفوف»</li><li><b>ب.</b> «اتفقت العينة 92%، فالجدول صحيح بنسبة 92%»</li><li><b>ج.</b> «استُعمل المساعد المعتمد في ترميز السجل»</li><li><b>د.</b> «لم تُقرأ صفوف OTH، وقد تكون فيها أعطال»</li></ul></li>
<li><p>قرأ المساعد مقياس ضغط بتدريجين، bar في الخارج وpsi في الداخل، فكتب: «29 bar». القيمة المعروفة 2.0 bar. ما أرجح سبب للخطأ؟</p><ul><li><b>أ.</b> قرأ تدريج psi وكتب bar: 29 psi نحو 2 bar</li><li><b>ب.</b> انعكاس على الزجاج حرّك المؤشر علامة واحدة</li><li><b>ج.</b> قرأ المؤشر الأحمر الذي يسجل أعلى قيمة</li><li><b>د.</b> ضاعت الفاصلة العشرية من القراءة 2.9</li></ul></li>
<li><p>مقياس أصغر تدريج فيه 0.2 bar، والتفاوت المسموح نصف أصغر تدريج. القيمة المعروفة 3.4 bar، وقراءة المساعد 3.6 bar. كيف تُسجَّل القراءة؟</p><ul><li><b>أ.</b> صحيحة: الفرق علامة واحدة</li><li><b>ب.</b> خاطئة: الفرق 0.2 والمسموح 0.1</li><li><b>ج.</b> صحيحة: الوحدة مكتوبة كما على الجهاز</li><li><b>د.</b> لا تُسجَّل قبل صورة ثانية للمقياس</li></ul></li>
<li><p>صورة بطاقة قفل غير واضحة، وفي ملف القيم المعروفة: «غير مقروءة». أجاب المساعد: «رمز القاطع Q-204». كيف تُسجَّل في جدول القراءات الخاطئة؟</p><ul><li><b>أ.</b> صحيحة إن كان Q-204 فعلًا رمز القاطع في المحطة</li><li><b>ب.</b> نصف صحيحة: الرمز معقول والصورة رديئة</li><li><b>ج.</b> تُستبعد من الجدول لأن الصورة رديئة</li><li><b>د.</b> خاطئة: الجواب الصحيح «غير مقروءة»</li></ul></li>
<li><p>تكتب قاعدة القراءة بعد قياس المساعد على صور بقيم معروفة. أي سطرين منها يسندهما القياس وحدود المستوى ج؟ اختر اثنين.</p><ul><li><b>أ.</b> كل قراءة تدخل قرار سلامة يقرؤها إنسان من الجهاز نفسه</li><li><b>ب.</b> كل نوع تجاوزت قراءاته الخاطئة الحد الذي يكتبه مالك القاعدة يقرؤه إنسان</li><li><b>ج.</b> تُعتمد كل قراءة يقول المساعد إنه واثق منها</li><li><b>د.</b> لا يُعاد القياس بعد تحديث الأداة إن كانت نسب الخطأ منخفضة</li></ul></li>
<li><p>سألت نموذجًا محليًّا داخل الشبكة عن صمام في مخطط سري: هل هو مفتوح عادةً؟ فأجاب: «مفتوح عادةً». في مفتاح المخطط الرمز المظلَّل مغلق عادةً، ورمز هذا الصمام مظلَّل. ماذا تسجّل؟</p><ul><li><b>أ.</b> قراءة صحيحة: النموذج المحلي مسموح للمخطط السري</li><li><b>ب.</b> قراءة خاطئة: المظلَّل مغلق عادةً</li><li><b>ج.</b> تسأل مساعدًا عامًّا ليؤكد أحد الجوابين</li><li><b>د.</b> قراءة صحيحة إن ذكر النموذج مفتاح المخطط في جوابه</li></ul></li>
<li><p>قال الفني في ملاحظته: «الاهتزاز أربعة فاصلة خمسة ملي متر في الثانية». التفريغ كتب 45، وتقرير المساعد كذلك. أي تحقق يلتقط الخطأ؟</p><ul><li><b>أ.</b> أن تطلب من المساعد أن يراجع التقرير ويصحح أخطاءه</li><li><b>ب.</b> أن تطابق الوحدات وحدها، لأنها أكثر ما يخطئ فيه</li><li><b>ج.</b> أن تطابق الأرقام والرموز والنفي على التسجيل</li><li><b>د.</b> أن تطابق التقرير على التفريغ حقلًا حقلًا</li></ul></li>
<li><p>في تقرير مهيكل بناه المساعد من تفريغ ملاحظة صوتية جملة: «وأُبلغ المشرف بالعطل». سمعت التسجيل كله ولم تجدها فيه. ما العمل؟</p><ul><li><b>أ.</b> تبقيها، فهي لا تغيّر رقمًا ولا رمزًا</li><li><b>ب.</b> تبقيها وتكتب بجانبها «بحسب المساعد»</li><li><b>ج.</b> تسأل الفني لاحقًا، وتبقيها حتى يجيب</li><li><b>د.</b> تحذفها، وتطابق بقية الجمل على التسجيل</li></ul></li>
</ol>
</section>
<section>
<h2>المشروع الختامي: بطاقة إعادة التصميم والمراجعة المباشرة</h2>
<ol>
<li><p>مهندسة في جهة أخرى قاست مهمة مشابهة. خط الأساس باليد: 18 دقيقة، وحقل خاطئ. التشغيل الأول بالمساعد: 7 دقائق، وثلاثة حقول خاطئة. الثاني، بعد أن طابقت الأرقام والرموز والنفي أولًا: 11 دقيقة، ولا حقل خاطئ. أي استنتاج تسنده الأسطر؟</p><ul><li><b>أ.</b> التشغيل الأول هو الأفضل لأنه الأسرع، فتُعتمد طريقته كما هي</li><li><b>ب.</b> المساعد يخفض وقت تقارير الفحص بنحو 40% لكل من يستعمله</li><li><b>ج.</b> التعديل جعلها أسرع من خط الأساس بلا حقل خاطئ هنا، ويُعاد القياس</li><li><b>د.</b> المساعد لا يصلح لهذه المهمة، لأن التشغيل الأول فيه ثلاثة حقول خاطئة</li></ul></li>
<li><p>في بطاقة إعادة التصميم لمهمة «من الملاحظة الصوتية إلى تقرير الفحص» خانة الاعتماد. ما الذي يُكتب فيها؟</p><ul><li><b>أ.</b> «المساعد، بعد مراجعته للتقرير»</li><li><b>ب.</b> «مشرف الوردية، بعد مطابقة الحقول على التسجيل»</li><li><b>ج.</b> «الفني الذي سجّل الملاحظة، لأنه أعرف بما قال»</li><li><b>د.</b> «من يتوفر من مهندسي المحطة»</li></ul></li>
<li><p>بين التشغيلين غيّر مشارك ثلاثة أشياء معًا: الطلب، وترتيب المطابقة، وقالب التقرير. التشغيل الثاني أسرع وبلا حقل خاطئ. ماذا يستنتج؟</p><ul><li><b>أ.</b> أن التعديلات الثلاثة كلها نافعة</li><li><b>ب.</b> أن تغيير الطلب هو ما نفع، لأنه أكبرها</li><li><b>ج.</b> أنه لا يعرف أي التعديلات نفع، فيقيس بتعديل واحد</li><li><b>د.</b> أن المساعد تحسّن بين التشغيلين</li></ul></li>
<li><p>أي قاعدة توقف في بطاقة إعادة التصميم تسمّي علامة يعرفها غيرك ويتحقق منها؟</p><ul><li><b>أ.</b> «أتوقف إذا شعرت أن المساعد غير دقيق في التقرير»</li><li><b>ب.</b> «أراجع التقرير جيدًا قبل أن أرسله إلى المشرف»</li><li><b>ج.</b> «أستعمل المساعد في الملاحظات البسيطة وحدها»</li><li><b>د.</b> «إذا وجدت في التقرير جملة لم تُقل، أكتبه بيدي»</li></ul></li>
</ol>
